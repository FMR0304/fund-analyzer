# ============================================================
# 基金日报 - GitHub Actions 自动工作流
# ============================================================
# 功能:
#   1. 工作日每天 12:30 UTC (20:30 CST) 自动运行
#   2. 采集基金净值 + 市场指数
#   3. DeepSeek AI 分析
#   4. 生成 HTML 日报
#   5. 推送至微信 (PushPlus)
#   6. 发布到 GitHub Pages
#
# 说明:
#   - QDII基金净值在 A股收盘后数小时更新，20:30运行可获取最新数据
#   - 支持手动触发: 在 Actions 页面点击 "Run workflow"
# ============================================================

name: 📊 基金日报

on:
  # 定时触发: 工作日周一至周五 12:30 UTC = 20:30 北京时间
  schedule:
    - cron: '30 12 * * 1-5'

  # 支持手动触发（在 GitHub Actions 页面点按钮）
  workflow_dispatch:

# 权限设置
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只运行一个实例
concurrency:
  group: "fund-report"
  cancel-in-progress: false

jobs:
  generate-report:
    name: 生成基金日报
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Python
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. 安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash

      # 4. 运行主程序
      - name: 运行基金日报生成程序
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python src/main.py
        shell: bash

      # 5. 配置 Pages
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v4

      # 6. 上传报告产物
      - name: 上传报告
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      # 7. 部署到 GitHub Pages
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
